<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Happy hacking">
<title>Happy hacking</title>
<defs>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#e5484d"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <clipPath id="type"><rect class="typer" x="445" y="60" width="335" height="30"/></clipPath>
</defs>
<style>
  .typer{transform-box:fill-box;transform-origin:left;animation:type 8s steps(31,end) infinite}
  @keyframes type{0%{transform:scaleX(0)}45%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .cursor{animation:cur 8s steps(31,end) infinite,blink 1s step-end infinite}
  @keyframes cur{0%{transform:translateX(0)}45%,90%{transform:translateX(335px)}100%{transform:translateX(0)}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="168" rx="16" fill="#ffffff" stroke="#e5484d" stroke-opacity="0.25"/>
<text x="421" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#e5484d">$</text>
<g clip-path="url(#type)"><text x="445" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#1f2328" xml:space="preserve">exit 0  # disclose responsibly.</text></g>
<rect class="cursor" x="447" y="66" width="10" height="22" fill="#e5484d"/>
<text x="600.0" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">CVE Research · by <tspan fill="url(#t)" font-weight="700">Hacking-Notes</tspan></text>
</svg>
